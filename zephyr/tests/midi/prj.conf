CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
# Resolves to the host libstdc++ on native_sim and to GNU libstdc++ on the
# target; the firmware needs <cmath> and <cstring>, which the minimal C++
# library does not provide.
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# duo_compat.h reaches for the entropy source to implement random().
CONFIG_ENTROPY_GENERATOR=y
