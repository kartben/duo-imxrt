CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
# The DSP needs <cmath>, which the minimal C++ library does not provide.
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_FPU=y

# duo_compat.h reaches for the entropy source to implement random().
CONFIG_ENTROPY_GENERATOR=y

# The voice renders whole blocks on the test thread.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
