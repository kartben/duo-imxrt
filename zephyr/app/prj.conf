CONFIG_CPP=y
CONFIG_STD_CPP17=y
# The firmware needs <cmath> and <cstring>, which the minimal C++ library does
# not provide. This resolves to GNU libstdc++ on the target.
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FLOAT_PRINTF=n
CONFIG_FPU=y
# The control loop and the audio thread both do float maths, and the audio
# thread preempts the control loop at arbitrary points.
CONFIG_FPU_SHARING=y

# Peripherals
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_DMA=y
CONFIG_I2S=y
CONFIG_LED_STRIP=y
CONFIG_REBOOT=y
CONFIG_ENTROPY_GENERATOR=y

# Button matrix. The scanning thread runs at a cooperative priority so that a
# key press is picked up promptly even though the control loop in main() never
# blocks; it is short-lived and sleeps between scans.
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KBD_MATRIX=y
CONFIG_INPUT_KBD_MATRIX_THREAD_PRIORITY=-2
# Deliver key events from the scanning thread itself. With the default input
# thread, which runs at the lowest application priority, nothing is delivered
# while main() busy-waits through the power-on setup window, so holding a key
# at power-on (to pick the MIDI channel or the scale) would have no effect.
# The callback only queues the event, so this is safe from that thread.
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# USB MIDI
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MIDI2_CLASS=y

# eDMA reads the audio and LED buffers directly, so they must be uncached.
CONFIG_NOCACHE_MEMORY=y

# DTCM is reserved for the delay line, which needs all of it; the eDMA
# descriptors go in regular SRAM instead.
CONFIG_DMA_MCUX_USE_DTCM_FOR_DMA_DESCRIPTORS=n

# The MIDI DIN jacks own LPUART1, so there is no console. Enable the RTT
# overlay (rtt-debug.conf) to get logging over the debug probe instead.
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

