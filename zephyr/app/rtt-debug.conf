#
# Extra configuration for debugging over a SWD probe. The MIDI DIN jacks own
# the only UART, so logging goes over SEGGER RTT instead:
#
#   west build -b duo_brains2 zephyr/app -- -DEXTRA_CONF_FILE=rtt-debug.conf

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_DUO_LOG_LEVEL_DBG=y
CONFIG_BOOT_BANNER=y
CONFIG_THREAD_NAME=y
