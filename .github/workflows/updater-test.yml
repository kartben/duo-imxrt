name: Firmware updater

on:
  push:
    paths:
      - 'tools/updater/**'
      - '.github/workflows/updater-test.yml'
  pull_request:
    paths:
      - 'tools/updater/**'
      - '.github/workflows/updater-test.yml'
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/updater
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # The image checks and the write sequence, against a simulated
      # flashloader; no DUO needed.
      - name: Run tests
        run: uv run --frozen python -m unittest discover -s tests -v
